<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RTBG240601-2299 检测报告预览</title>
  <style>
    :root { --bg:#f5f6f8; --card:#ffffff; --text:#1f2328; --muted:#6b7280; --line:#e5e7eb; --accent:#1677ff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:980px; margin:0 auto; padding:16px 12px 40px; }
    .card { background:var(--card); border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,.06); overflow:hidden; border:1px solid var(--line); }
    .header { padding:18px 18px 14px; border-bottom:1px solid var(--line); }
    .title { margin:0; font-size:20px; font-weight:700; line-height:1.4; }
    .sub { margin-top:8px; color:var(--muted); font-size:14px; line-height:1.6; }
    .btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
    .btn { display:inline-block; padding:10px 14px; border-radius:10px; text-decoration:none; font-size:14px; font-weight:600; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-secondary { background:#eef4ff; color:var(--accent); }
    .pages { padding:14px; }
    .page { margin:0 0 14px; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .page-label { padding:10px 12px; font-size:13px; color:var(--muted); border-bottom:1px solid var(--line); background:#fafafa; }
    .page img { display:block; width:100%; height:auto; }
    .footer { text-align:center; color:var(--muted); font-size:12px; padding:10px 0 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <h1 class="title">检测报告在线预览</h1>
        <div class="sub">
          报告编号：<strong>RTBG240601-2299</strong><br>
          扫码后可直接在微信中查看页面预览；如需原始文件，可下载 PDF。
        </div>
        <div class="btns">
          <a class="btn btn-primary" href="./RTBG240601-2299.pdf">下载 PDF 原件</a>
          <a class="btn btn-secondary" href="#pages">直接查看报告内容</a>
        </div>
      </div>
      <div class="pages" id="pages">
        <div class="page"><div class="page-label">第 1 页</div><img src="./report_pages/RTBG240601-2299/page-1.jpg" alt="检测报告第1页" loading="lazy"></div>
        <div class="page"><div class="page-label">第 2 页</div><img src="./report_pages/RTBG240601-2299/page-2.jpg" alt="检测报告第2页" loading="lazy"></div>
        <div class="page"><div class="page-label">第 3 页</div><img src="./report_pages/RTBG240601-2299/page-3.jpg" alt="检测报告第3页" loading="lazy"></div>
        <div class="page"><div class="page-label">第 4 页</div><img src="./report_pages/RTBG240601-2299/page-4.jpg" alt="检测报告第4页" loading="lazy"></div>
        <div class="page"><div class="page-label">第 5 页</div><img src="./report_pages/RTBG240601-2299/page-5.jpg" alt="检测报告第5页" loading="lazy"></div>
        <div class="page"><div class="page-label">第 6 页</div><img src="./report_pages/RTBG240601-2299/page-6.jpg" alt="检测报告第6页" loading="lazy"></div>
      </div>
    </div>
    <div class="footer">本页面用于微信预览，文件托管于 GitHub Pages。</div>
  </div>
</body>
</html>
